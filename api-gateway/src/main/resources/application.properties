spring.application.name=api-gateway
server.port=8090

eureka.client.service-url.defaultZone=${LEXO_EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${LEXO_EUREKA_HOSTNAME:localhost}

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**,/api/usuarios/**,/api/convites/**,/api/2fa/**,/api/conta/**,/api/organizacao/**,/api/perfil/**

spring.cloud.gateway.routes[1].id=cliente-service
spring.cloud.gateway.routes[1].uri=lb://cliente-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/clientes/**,/api/portal/**

spring.cloud.gateway.routes[2].id=auditoria-service
spring.cloud.gateway.routes[2].uri=lb://auditoria-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/auditoria/**

spring.cloud.gateway.routes[3].id=processo-service
spring.cloud.gateway.routes[3].uri=lb://processo-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/processos/**,/api/agenda/**

spring.cloud.gateway.routes[4].id=financeiro-service
spring.cloud.gateway.routes[4].uri=lb://financeiro-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/financeiro/**

spring.cloud.gateway.routes[5].id=ia-service
spring.cloud.gateway.routes[5].uri=lb://ia-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/ia/**

spring.cloud.gateway.routes[6].id=auth-service-docs
spring.cloud.gateway.routes[6].uri=lb://auth-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/docs/auth-service/v3/api-docs
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/docs/auth-service/v3/api-docs,/v3/api-docs

spring.cloud.gateway.routes[7].id=cliente-service-docs
spring.cloud.gateway.routes[7].uri=lb://cliente-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/docs/cliente-service/v3/api-docs
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/docs/cliente-service/v3/api-docs,/v3/api-docs

spring.cloud.gateway.routes[8].id=processo-service-docs
spring.cloud.gateway.routes[8].uri=lb://processo-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/docs/processo-service/v3/api-docs
spring.cloud.gateway.routes[8].filters[0]=RewritePath=/docs/processo-service/v3/api-docs,/v3/api-docs

spring.cloud.gateway.routes[9].id=financeiro-service-docs
spring.cloud.gateway.routes[9].uri=lb://financeiro-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/docs/financeiro-service/v3/api-docs
spring.cloud.gateway.routes[9].filters[0]=RewritePath=/docs/financeiro-service/v3/api-docs,/v3/api-docs

spring.cloud.gateway.routes[10].id=auditoria-service-docs
spring.cloud.gateway.routes[10].uri=lb://auditoria-service
spring.cloud.gateway.routes[10].predicates[0]=Path=/docs/auditoria-service/v3/api-docs
spring.cloud.gateway.routes[10].filters[0]=RewritePath=/docs/auditoria-service/v3/api-docs,/v3/api-docs

spring.cloud.gateway.routes[11].id=ia-service-docs
spring.cloud.gateway.routes[11].uri=lb://ia-service
spring.cloud.gateway.routes[11].predicates[0]=Path=/docs/ia-service/v3/api-docs
spring.cloud.gateway.routes[11].filters[0]=RewritePath=/docs/ia-service/v3/api-docs,/v3/api-docs

springdoc.swagger-ui.urls[0].url=/docs/auth-service/v3/api-docs
springdoc.swagger-ui.urls[0].name=auth-service
springdoc.swagger-ui.urls[1].url=/docs/cliente-service/v3/api-docs
springdoc.swagger-ui.urls[1].name=cliente-service
springdoc.swagger-ui.urls[2].url=/docs/processo-service/v3/api-docs
springdoc.swagger-ui.urls[2].name=processo-service
springdoc.swagger-ui.urls[3].url=/docs/financeiro-service/v3/api-docs
springdoc.swagger-ui.urls[3].name=financeiro-service
springdoc.swagger-ui.urls[4].url=/docs/auditoria-service/v3/api-docs
springdoc.swagger-ui.urls[4].name=auditoria-service
springdoc.swagger-ui.urls[5].url=/docs/ia-service/v3/api-docs
springdoc.swagger-ui.urls[5].name=ia-service
springdoc.swagger-ui.urls-primary-name=auth-service

lexo.auth-secret=${AUTH_SECRET:troque-esta-chave-em-producao-com-no-minimo-32-bytes}
lexo.gateway.signing-key=${GATEWAY_SIGNING_KEY:lexo-gateway-dev-signing-key-com-mais-de-32-bytes}
lexo.gateway.signature-tolerance-seconds=${GATEWAY_SIG_TOLERANCE:60}

lexo.cors.allowed-origins=${LEXO_CORS_ORIGINS:http://localhost:5180,http://localhost:3000}

spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

spring.data.redis.host=${LEXO_REDIS_HOST:localhost}
spring.data.redis.port=${LEXO_REDIS_PORT:6380}
spring.data.redis.password=${LEXO_REDIS_PASSWORD:}

spring.cloud.gateway.redis-rate-limiter.replenish-rate=${LEXO_RATE_LIMIT_REPLENISH:30}
spring.cloud.gateway.redis-rate-limiter.burst-capacity=${LEXO_RATE_LIMIT_BURST:60}
spring.cloud.gateway.redis-rate-limiter.requested-tokens=1

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${LEXO_ZIPKIN:http://localhost:9411/api/v2/spans}
logging.pattern.level=%5p [%X{traceId:-},%X{spanId:-}]
