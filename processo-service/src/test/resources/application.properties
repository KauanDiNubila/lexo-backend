spring.application.name=processo-service
lexo.public-api-url=http://localhost:8090

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

lexo.cors.allowed-origins=http://localhost:3000
lexo.cache.ttl-minutes=10

spring.cache.type=none
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.listener.auto-startup=false
spring.kafka.producer.properties.max.block.ms=1
spring.rabbitmq.listener.simple.auto-startup=false
eureka.client.enabled=false

lexo.internal.api-key=chave-de-teste-interna
lexo.gateway.signing-key=chave-de-assinatura-de-teste-com-mais-de-32-bytes
