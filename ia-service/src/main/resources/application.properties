spring.application.name=ia-service
server.port=${PORT:8087}

eureka.client.service-url.defaultZone=${LEXO_EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.hostname=${LEXO_EUREKA_HOSTNAME:localhost}

lexo.gateway.signing-key=${GATEWAY_SIGNING_KEY:lexo-gateway-dev-signing-key-com-mais-de-32-bytes}
lexo.gateway.signature-tolerance-seconds=${GATEWAY_SIG_TOLERANCE:60}
lexo.cors.allowed-origins=${LEXO_CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

spring.data.redis.host=${LEXO_REDIS_HOST:localhost}
spring.data.redis.port=${LEXO_REDIS_PORT:6380}

lexo.ia.limite-por-minuto=${LEXO_IA_LIMITE:20}
lexo.ia.gemini.api-key=${GEMINI_API_KEY:}
lexo.ia.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
lexo.ia.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
lexo.ia.gemini.connect-timeout-seconds=${GEMINI_CONNECT_TIMEOUT:5}
lexo.ia.gemini.read-timeout-seconds=${GEMINI_READ_TIMEOUT:30}

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${LEXO_ZIPKIN:http://localhost:9411/api/v2/spans}
logging.pattern.level=%5p [%X{traceId:-},%X{spanId:-}]
