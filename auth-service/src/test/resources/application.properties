spring.application.name=auth-service
lexo.public-api-url=http://localhost:8090

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

lexo.auth-secret=segredo-de-teste-do-auth-com-mais-de-32-bytes
lexo.jwt-expiration-minutes=15
lexo.refresh-expiration-days=30
lexo.totp-enc-key=
lexo.base-url=http://localhost:8090
lexo.cors.allowed-origins=http://localhost:3000

spring.cache.type=none
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.listener.auto-startup=false
spring.kafka.producer.properties.max.block.ms=1
spring.rabbitmq.listener.simple.auto-startup=false
eureka.client.enabled=false

lexo.internal.api-key=chave-de-teste-interna
lexo.gateway.signing-key=chave-de-assinatura-de-teste-com-mais-de-32-bytes
